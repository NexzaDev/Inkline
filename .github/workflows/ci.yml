name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.90.0"
  NODE_VERSION: "22"

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: rust-core

      - name: Check formatting
        run: |
          cargo fmt --all
          if ! git diff --quiet -- '*.rs'; then
            scripts/ci/note.sh "cargo fmt" "$(git diff -- '*.rs' | head -n 200)"
            echo "::error title=cargo fmt::the checked-in Rust sources are not formatted"
            exit 1
          fi

      - name: Lint the core crates
        run: scripts/ci/capture.sh "clippy" cargo clippy -p graph-core -p graph-cli --all-targets -- -D warnings

      - name: Test the core crates
        run: scripts/ci/capture.sh "cargo test" cargo test -p graph-core -p graph-cli

      - name: Resolve the dependency graph
        run: cargo generate-lockfile

      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-deny@0.20.2

      - name: Check licences
        run: scripts/ci/capture.sh "cargo deny licences" cargo-deny --all-features check licenses

      - name: Check advisories
        run: scripts/ci/capture.sh "cargo deny advisories" cargo-deny --all-features check advisories

      - name: Check duplicate and wildcard versions
        run: scripts/ci/capture.sh "cargo deny bans" cargo-deny --all-features check bans

      - name: Check dependency sources
        run: scripts/ci/capture.sh "cargo deny sources" cargo-deny --all-features check sources

      - name: Publish the resolved lockfile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: warn
          retention-days: 7

  web:
    name: Shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/shell
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/shell/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the vendored editor
        working-directory: .
        run: scripts/vendor-drawio.sh check

      - name: Report bundle size
        run: |
          du -sh dist dist/editor
          find dist/assets dist/index.html -type f -printf "%s\t%p\n" | sort -rn

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/shell/package-lock.json

      - name: Install the build tooling
        run: |
          npm ci
          npm ci --prefix web/shell

      - name: Install the pinned toolchain and Android targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target i686-linux-android \
            --target x86_64-linux-android
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: android

      - name: Install Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install the SDK platform
        run: scripts/ci/capture.sh "android platform" sdkmanager --install "platforms;android-37.0" "platform-tools"

      - name: Install the build tools
        run: scripts/ci/capture.sh "android build tools" sdkmanager --install "build-tools;37.0.0"

      - name: Select the NDK
        run: |
          ndk="$(ls -d "$ANDROID_HOME"/ndk/29.*/ 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$ndk" ]; then
            ndk="$(ls -d "$ANDROID_HOME"/ndk/*/ | sort -V | tail -n 1)"
          fi
          printf 'NDK_HOME=%s\n' "${ndk%/}" >> "$GITHUB_ENV"
          scripts/ci/note.sh "android toolchain" "ndk ${ndk%/}; platforms $(ls "$ANDROID_HOME/platforms" | tr '\n' ' '); build tools $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"

      - name: Verify the NDK toolchain
        run: scripts/ci/capture.sh "ndk" "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" --version

      - name: Build the APK
        run: scripts/ci/capture.sh "android build" npx tauri android build --debug --apk --target aarch64 --ci

      - name: Report APK size
        run: |
          find src-tauri/gen/android/app/build/outputs -name "*.apk" -printf "%s\t%p\n"

      - name: Publish the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: inkline-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
