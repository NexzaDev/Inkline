[workspace]
resolver = "2"
members = ["crates/graph-core", "crates/graph-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Inkline maintainers"]
repository = "https://github.com/NexzaDev/Inkline"
homepage = "https://github.com/NexzaDev/Inkline"

[workspace.dependencies]
graph-core = { path = "crates/graph-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-build = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = 1
